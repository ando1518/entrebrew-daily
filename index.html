<title>EntreBrew Daily</title>
<meta name="theme-color" content="#FFA41B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EB Daily">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#EAF0EC; --ink:#15302A; --muted:#5B716B; --line:#D9E3DE;
  --accent:#FFA41B; --accent-soft:#FFF0D4; --accent-ink:#8A4A00;
  --leaf:#15A36A; --leaf-soft:#DDF4E9;
  --cherry:#DC3F47; --cherry-soft:#FCE3E4;
  --sky:#2872D9; --sky-soft:#E2EDFC;
  --hero-ink:#2B1800; --hero-chip:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(21,48,42,.06),0 6px 16px rgba(21,48,42,.06);
  --scrim:rgba(12,28,24,.42);
  --r:16px;
  --font-d:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --font-b:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1916; --surface:#172421; --surface2:#20312C; --ink:#E7F1ED; --muted:#9BB0AA; --line:#2B3E38;
    --accent:#FFB13D; --accent-soft:#3A2B14; --accent-ink:#FFCF86;
    --leaf:#3CCF93; --leaf-soft:#153A2B;
    --cherry:#FF6C73; --cherry-soft:#3E1F22;
    --sky:#72AEFF; --sky-soft:#182A40;
    --hero-chip:rgba(255,255,255,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1916; --surface:#172421; --surface2:#20312C; --ink:#E7F1ED; --muted:#9BB0AA; --line:#2B3E38;
  --accent:#FFB13D; --accent-soft:#3A2B14; --accent-ink:#FFCF86;
  --leaf:#3CCF93; --leaf-soft:#153A2B;
  --cherry:#FF6C73; --cherry-soft:#3E1F22;
  --sky:#72AEFF; --sky-soft:#182A40;
  --hero-chip:rgba(255,255,255,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:.01em}
.brand small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.brand svg{width:26px;height:26px}
.banner{background:var(--sky-soft);color:var(--sky);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--hero-ink);border-radius:24px;padding:18px 18px 16px;display:grid;gap:14px}
.hero::before{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::after{content:"";position:absolute;right:30px;top:-20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.3)}
.hero > *{position:relative;z-index:1}
.hero-date{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em}
.hero h1{font-family:var(--font-d);font-weight:800;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--hero-chip);border:0;border-radius:14px;padding:10px 10px 8px;text-align:left;color:var(--hero-ink)}
.stat b{display:block;font-family:var(--font-d);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;font-weight:700;line-height:1.35}

/* sections */
.pg{font-family:var(--font-d);font-weight:800;font-size:24px;margin:4px 0 12px}
.sec{margin-top:24px;display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-family:var(--font-d);font-weight:800;font-size:17px;margin:0}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:700;font-size:13px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.readonly{background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:12px}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg .ct{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}

/* avatar & chips */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:13px;object-fit:cover;flex:none;background:var(--muted)}
.av.sm{width:20px;height:20px;font-size:10px}
.pill,.due{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.due{background:var(--surface2);color:var(--muted)}
.due.over{background:var(--cherry-soft);color:var(--cherry)}
.due.today{background:var(--accent-soft);color:var(--accent-ink)}
.due.soon{background:var(--sky-soft);color:var(--sky)}
.p-todo{background:var(--surface2);color:var(--muted)}
.p-doing{background:var(--accent-soft);color:var(--accent-ink)}
.p-done{background:var(--leaf-soft);color:var(--leaf)}
.c-day{background:var(--leaf-soft);color:var(--leaf)}
.c-note{background:var(--accent-soft);color:var(--accent-ink)}
.c-share{background:var(--sky-soft);color:var(--sky)}
.to-me{background:var(--cherry-soft);color:var(--cherry)}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start}
.st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;padding:0;margin-top:1px}
.st svg{width:16px;height:16px}
.st.doing{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 5px,transparent 6px)}
.st.done{background:var(--leaf);border-color:var(--leaf);color:#fff}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-main b{display:block;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.task.done .t-main b{text-decoration:line-through;color:var(--muted)}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.who-sm{display:inline-flex;align-items:center;gap:4px}

/* reports */
.r-head{display:flex;gap:10px;align-items:center}
.r-who{flex:1;min-width:0}
.r-who b{display:block;font-size:14px;line-height:1.3}
.r-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.r-body{margin:10px 0 0;overflow-wrap:anywhere}
.mention{color:var(--sky);font-weight:700;background:var(--sky-soft);border-radius:6px;padding:0 4px}
.mention.me{color:var(--accent-ink);background:var(--accent-soft)}
.r-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ack{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.ack svg{width:15px;height:15px}
.ack.on{background:var(--leaf-soft);border-color:transparent;color:var(--leaf)}
.stack{display:flex;align-items:center;padding-left:6px}
.stack .av{margin-left:-6px;border:2px solid var(--surface)}
.ack-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.del{margin-left:auto;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 6px}
.del.armed{color:var(--cherry)}

/* calendar */
.cal{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h h2{font-family:var(--font-d);font-weight:800;font-size:18px;margin:0;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.today-btn{border:0;background:var(--surface2);border-radius:12px;padding:0 12px;font-weight:700;font-size:13px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.dow.sun,.day.sun .n{color:var(--cherry)}
.dow.sat,.day.sat .n{color:var(--sky)}
.day{border:0;background:none;border-radius:12px;display:grid;justify-items:center;align-content:start;gap:3px;padding:4px 0 6px;min-height:52px;font-variant-numeric:tabular-nums}
.day .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.day.out{opacity:.35}
.day.sel{background:var(--surface2)}
.day.is-today .n{background:var(--accent);color:var(--hero-ink)}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.ev{background:var(--accent)}
.dot.tk{background:var(--leaf)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;padding-left:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.evrow{display:flex;gap:12px;align-items:center;cursor:pointer;border-left:6px solid var(--ec,var(--accent))}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:0;background:var(--sw);padding:0;display:grid;place-items:center;color:#fff}
.swatches button svg{width:16px;height:16px;display:none}
.swatches button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sw)}
.swatches button.on svg{display:block}
.pane-hint{font-size:12px;color:var(--muted);font-weight:400;margin:0}
.ev-time{flex:none;width:52px;font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.ev-body{flex:1;min-width:0}
.ev-body b{display:block;overflow-wrap:anywhere}
.ev-body span{font-size:12.5px;color:var(--muted)}

/* todo */
.todo-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.todo-add #todoText{grid-column:1/-1}
.todo-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:transparent;padding:0}
.chk svg{width:15px;height:15px}
.chk.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.todo-txt{flex:1;min-width:0;overflow-wrap:anywhere}
.todo.done .todo-txt{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.todo-sub{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 4px 8px}

/* forms */
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:96px;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.fld{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px}
.primary{background:var(--accent);color:var(--hero-ink)}
.ghost{background:var(--surface2);color:var(--ink)}
.danger{background:none;color:var(--cherry);padding-inline:6px}
.danger.armed{background:var(--cherry-soft)}
.actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.actions .sp{flex:1}

/* picker & suggestions */
.picker{display:grid;gap:8px}
.chosen{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:14.5px}
.chosen .me-btn{margin-left:auto;border:1.5px solid var(--line);background:none;border-radius:999px;padding:2px 12px;font-size:12.5px;color:var(--muted)}
.sugg{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px;display:grid;gap:2px;max-height:220px;overflow:auto}
.sugg button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px;border-radius:8px;text-align:left;font-weight:700;font-size:14.5px}
.sugg button:hover,.sugg button:focus-visible{background:var(--surface2)}
.sugg p{margin:0;padding:8px;font-size:13px}
.mwrap{display:grid;gap:6px}
.hint{font-size:12px;color:var(--muted);font-weight:400}

/* departments, profile, org chart */
.dp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px 1px 7px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.dp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dc,var(--muted))}
.dps{display:flex;flex-wrap:wrap;gap:5px}
.hero .dp{background:var(--hero-chip);color:var(--hero-ink)}
.mention.grp{color:var(--leaf);background:var(--leaf-soft)}
.mention.grp.me{color:var(--accent-ink);background:var(--accent-soft)}
.sugg .grp-hit .gdot{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.sugg .sub{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.sugg .lab{padding:6px 8px 2px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.dept-pick{display:flex;flex-wrap:wrap;gap:8px}
.dept-pick button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:none;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.dept-pick button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dc)}
.dept-pick button.on{border-color:var(--dc);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--dc)}
.dept-pick button .ok{display:none;width:14px;height:14px;color:var(--dc)}
.dept-pick button.on .ok{display:block}
.intro{margin:0;font-size:13.5px;color:var(--muted)}
.bdsel{display:flex;gap:8px;align-items:center}
.bdsel select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px}
.prof{display:grid;gap:14px;justify-items:start}
.prof-top{display:flex;gap:14px;align-items:center;width:100%}
.prof-top .av{width:60px;height:60px;font-size:22px}
.prof-top b{display:block;font-family:var(--font-d);font-size:20px;line-height:1.3}
.prof-row{display:grid;gap:4px;width:100%}
.prof-row .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.passion{margin:0;background:var(--surface2);border-radius:14px;padding:12px 14px;line-height:1.75;overflow-wrap:anywhere;width:100%}
.passion.none{color:var(--muted);font-size:13.5px}
.bday-card{display:flex;align-items:center;gap:12px;background:var(--cherry-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;cursor:pointer;border:0;width:100%;text-align:left}
.bday-card .when{margin-left:auto;font-size:12px;font-weight:700;color:var(--cherry);white-space:nowrap}
.dot.bd{background:var(--cherry)}
.org-top{display:flex;gap:12px;align-items:center;background:var(--accent);color:var(--hero-ink);border-radius:var(--r);padding:14px;border:0;width:100%;text-align:left}
.org-top b{font-family:var(--font-d);font-size:18px}
.org-top .n{font-size:12px;font-weight:700;opacity:.8}
.org-top .stack .av{border-color:var(--accent)}
.org-top .chev{width:18px;height:18px;flex:none;transition:transform .15s}
.org-top[aria-expanded="true"] .chev{transform:rotate(90deg)}
.org-top-wrap{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.mem .chev{width:16px;height:16px;color:var(--muted);flex:none}
.org-tree{position:relative;margin-left:26px;padding-left:18px;border-left:2px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-top:12px}
.org-node{position:relative;min-width:0}
.org-node::before{content:"";position:absolute;left:-18px;top:27px;width:16px;border-top:2px solid var(--line)}
.org-node:last-child::after{content:"";position:absolute;left:-21px;top:29px;bottom:-2px;width:4px;background:var(--bg)}
.org-head{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface);border:0;border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);text-align:left}
.org-head .sw{width:12px;height:12px;border-radius:4px;background:var(--dc);flex:none}
.org-head .nm{flex:1;min-width:0;font-weight:800;font-size:15px}
.org-head .n{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.org-head .chev{width:18px;height:18px;color:var(--muted);transition:transform .15s;flex:none}
.org-node.open .chev{transform:rotate(90deg)}
.org-body{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-top:6px;background:var(--surface);border-radius:var(--r);padding:6px;box-shadow:var(--shadow)}
.mem{display:flex;gap:10px;align-items:center;border:0;background:none;border-radius:10px;padding:8px;text-align:left;width:100%}
.mem:hover{background:var(--surface2)}
.mem .mt{flex:1;min-width:0}
.mem .mt b{display:block;font-size:14px}
.mem .mt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-hint{font-size:12px;color:var(--muted);padding:4px 8px 2px}
.me-card{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.me-card .mt{flex:1;min-width:0}
.me-card .mt b{display:block}

/* header actions, updates, feedback */

async function searchPeople(q){
  if(S.preview){return Object.entries(S.P).filter(([,p])=>!q||p.name.includes(q)).map(([id,p])=>({id,name:p.name,color:p.color,avatarUrl:''}));}

function upcomingBdays(days){
  const now=parse(today()),res=[];
  for(const [id,m] of Object.entries(S.members)){

/* ---------- data writes ---------- */
function fail(e){
  const c=e&&e.code;
  if(c==='permission-denied'){toast('この操作をする権限がありません');}
  else if(c==='resource-exhausted'){toast('今日の保存できる上限に達しました。時間をおいてお試しください');}
  else toast('保存できませんでした。通信状況を確認して、もう一度お試しください');
}
async function add(k,data){
  try{
    if(db){await db.collection(colPath(k)).add(data);}
    else{S[k].push({id:'l'+Math.random().toString(36).slice(2),...data});schedule();}
    return true;
  }catch(e){fail(e);return false;}
}
async function upd(k,id,patch){
  try{
    if(db){await db.collection(colPath(k)).doc(id).update(patch);}
    else{
      const it=S[k].find(x=>x.id===id);
      if(it){for(const [key,v] of Object.entries(patch)){it[key]=(v&&typeof v==='object'&&!Array.isArray(v))?{...(it[key]||{}),...v}:v;}}
      schedule();
    }
    return true;
  }catch(e){fail(e);return false;}
}
async function del(k,id){
  try{
    if(db){await db.collection(colPath(k)).doc(id).delete();}
    else{S[k]=S[k].filter(x=>x.id!==id);schedule();}
    return true;
  }catch(e){fail(e);return false;}
}
async function setDoc(k,id,data){
  try{
    if(db){await db.collection(k).doc(id).set(data,{merge:true});}
    else{S[k][id]=data;schedule();}
    return true;
  }catch(e){fail(e);return false;}
}

async function lgPhoto(file){
  const bmp=await createImageBitmap(file);
  for(const [edge,q] of [[1280,0.78],[1024,0.7],[800,0.62]]){
    const sc=Math.min(1,edge/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
    let url=c.toDataURL('image/webp',q);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/jpeg',q);
    if(url.length<700000)return url;
  }
  throw new Error('too-big');
}

calendar(){
  const m=S.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),weeks=Math.ceil((first.getDay()+dim)/7);
  const t=today(),evBy={},tkBy={};
  S.events.forEach(e=>{(evBy[e.date]=evBy[e.date]||[]).push(e.color||'');});
  S.tasks.forEach(k=>{if(k.due&&k.status!=='done')tkBy[k.due]=(tkBy[k.due]||0)+1;});
  const bdBy={};Object.values(S.members).forEach(m=>{if(m.birthday)bdBy[m.birthday]=1;});
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=new Date(y,mo,1-first.getDay()+i),s=ymd(d),w=d.getDay();
    const dots=(evBy[s]||[]).slice(0,2).map(c=>`<i class="dot ev"${c?` style="background:${esc(c)}"`:''}></i>`).join('')+Array(Math.min(tkBy[s]||0,2)).fill('<i class="dot tk"></i>').join('')+(bdBy[s.slice(5)]?'<i class="dot bd"></i>':'');
    cells+=`<button type="button" class="day ${d.getMonth()!==mo?'out':''} ${s===t?'is-today':''} ${s===S.calSel?'sel':''} ${w===0?'sun':w===6?'sat':''}" data-day="${s}" aria-label="${d.getMonth()+1}月${d.getDate()}日"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const sel=S.calSel,evs=S.events.filter(e=>e.date===sel).sort(byTime),tks=S.tasks.filter(k=>k.due===sel);
  const bds=Object.keys(S.members).filter(id=>S.members[id].birthday===sel.slice(5)).map(id=>({id,diff:dayDiff(sel),s:sel}));
  return `${roNote()}<div class="cal">
    <div class="cal-h"><h2>${y}年${mo+1}月</h2><div class="cal-nav">
      <button class="today-btn" type="button" data-cal="today">今日</button>
      <button class="icon-btn" type="button" data-cal="-1" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m14.5 6-6 6 6 6"/></svg></button>
      <button class="icon-btn" type="button" data-cal="1" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9.5 6 6 6-6 6"/></svg></button>
    </div></div>
    <div class="g7">${W.map((w,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i class="dot ev"></i>予定</span><span><i class="dot tk"></i>タスクの期限</span><span><i class="dot bd"></i>誕生日</span></div>
  </div>
  <section class="sec"><div class="sec-h"><h2>${fmtMD(sel)}${sel===t?'・今日':''}</h2></div>
    <div class="list">${bds.map(bdayCard).join('')}${evs.map(eventRow).join('')}${tks.map(taskCard).join('')}${!evs.length&&!tks.length&&!bds.length?empty('この日の予定はありません'):''}</div></section>`;

function mountPicker(el,init){
  let val=init||null,last=[];
  el.innerHTML='<div class="chosen"></div><input type="search" placeholder="名前で検索して担当者を選ぶ" autocomplete="off" id="pkQ"><div class="sugg" hidden></div>';
  const C=el.querySelector('.chosen'),Q=el.querySelector('input'),SG=el.querySelector('.sugg');
  const draw=()=>{C.innerHTML=(val?`${av(val,'sm')}<span>${esc(pname(val))}</span>`:'<span class="muted">担当者なし</span>')+(S.me.id&&val!==S.me.id?'<button type="button" class="me-btn">自分にする</button>':'');};
  const run=async()=>{
    const q=Q.value.trim();last=await searchPeople(q);
    SG.hidden=false;
    SG.innerHTML=last.length?last.map(h=>`<button type="button" data-id="${esc(h.id)}">${h.avatarUrl?`<img class="av sm" src="${esc(h.avatarUrl)}" alt="">`:av(h.id,'sm')}<span>${esc(h.name)}</span></button>`).join(''):`<p class="muted">${q?'見つかりません':'名前を入力して検索'}</p>`;
  };
  draw();
  Q.addEventListener('focus',run);Q.addEventListener('input',run);
  Q.addEventListener('blur',()=>setTimeout(()=>{SG.hidden=true;},150));
  SG.addEventListener('mousedown',e=>e.preventDefault());
  SG.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const h=last.find(x=>x.id===b.dataset.id);if(h)S.P[h.id]={...(S.P[h.id]||{}),...h};val=b.dataset.id;Q.value='';SG.hidden=true;draw();});

  return ()=>val;
}

      <div class="att" id="rAtt"></div>
      <div><button type="button" class="btn ghost" id="rAttBtn" style="padding:6px 14px;font-size:13.5px">ファイルを添付</button></div></div>
    <div class="fld" id="rFoldWrap" hidden><label for="rFold">保存先フォルダ</label><select id="rFold" class="fsel"></select><span class="hint" id="rFoldHint"></span></div>
    <div class="actions"><span class="sp"></span><button type="button" class="btn ghost" data-close>閉じる</button><button class="btn primary" type="submit">投稿する</button></div></form>`);
  const ta=$('#rBody'),SG=$('#mS');
  let files=[],userFold=false;
  const syncFold=()=>{
    const det=folderFromText(ta.value),urls=findUrls(ta.value),w=$('#rFoldWrap'),sel=$('#rFold');
    w.hidden=!(files.length||det||urls.length);if(w.hidden)return;
    const cur=sel.value,opts=[];
    if(det&&!folderByName(det))opts.push(`<option value="new:${esc(det)}">「${esc(det)}」を新しく作る</option>`);
    if(!folderByName(DEFAULT_REPORT_FOLDER))opts.push(`<option value="new:${DEFAULT_REPORT_FOLDER}">${DEFAULT_REPORT_FOLDER}（新しく作る）</option>`);
    S.folders.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja')).forEach(f=>opts.push(`<option value="id:${esc(f.id)}">${esc(f.name)}</option>`));
    sel.innerHTML=opts.join('');
    let want=cur;
    if(!userFold){const n=det||DEFAULT_REPORT_FOLDER,h=folderByName(n);want=h?'id:'+h.id:'new:'+n;}
    if([...sel.options].some(o=>o.value===want))sel.value=want;
    const parts=[];if(files.length)parts.push(`添付${files.length}件（軽くして保存）`);if(urls.length)parts.push(`リンク${urls.length}件`);
    $('#rFoldHint').textContent=parts.length?`${parts.join('と')}をこのフォルダに保存します`:'添付がないので、報告の本文をテキストファイルとして保存します';
  };
  const renderAtt=()=>{$('#rAtt').innerHTML=files.map((f,i)=>`<span class="attchip">${esc(f.name)}<small>${fmtSize(f.size)}</small><button type="button" data-rmatt="${i}" aria-label="添付を外す">×</button></span>`).join('');syncFold();};
  $('#rAttBtn').addEventListener('click',()=>pickFiles(fs=>{files=files.concat(fs).slice(0,10);renderAtt();}));
  $('#rAtt').addEventListener('click',e=>{const b=e.target.closest('[data-rmatt]');if(!b)return;files.splice(Number(b.dataset.rmatt),1);renderAtt();});
  $('#rFold').addEventListener('change',()=>{userFold=true;});
  ta.addEventListener('input',syncFold);
  $('#rCat').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;$('#rCat').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  const check=async()=>{
    const pos=ta.selectionStart,pre=ta.value.slice(0,pos),m=pre.match(/@([^\s@]{0,20})$/);
    if(!m){ms=null;SG.hidden=true;return;}
    ms={start:pos-m[0].length,end:pos};
    const q=m[1];hits=await searchPeople(q);
    if(!ms)return;
    const ql=q.toLowerCase(),gs=DEPTS.filter(d=>!q||d.toLowerCase().includes(ql));
    const allHit=!q||'全員'.includes(q)||'ぜんいん'.includes(q)||'all'.includes(ql);
    SG.hidden=false;
    SG.innerHTML=(allHit?`<div class="lab">全体に</div><button type="button" class="grp-hit" data-g="全員"><span class="gdot" style="background:#DC3F47">全</span><span>全員</span><span class="sub">${Object.keys(S.members).length}人</span></button>`:'')+(gs.length?'<div class="lab">部署でまとめて</div>'+gs.map(d=>`<button type="button" class="grp-hit" data-g="${esc(d)}"><span class="gdot" style="background:${DC[d]}">${esc(d.slice(0,1))}</span><span>${esc(d)}</span><span class="sub">${deptMembers(d).length}人</span></button>`).join(''):'')
      +(hits.length?'<div class="lab">メンバー</div>'+hits.map(h=>`<button type="button" data-id="${esc(h.id)}">${h.avatarUrl?`<img class="av sm" src="${esc(h.avatarUrl)}" alt="">`:av(h.id,'sm')}<span>${esc(h.name)}</span></button>`).join(''):'')
      ||`<p class="muted">${q?'該当する部署・メンバーがいません':'名前を入力して検索'}</p>`;
  };
  ta.addEventListener('input',check);ta.addEventListener('click',check);
  ta.addEventListener('blur',()=>setTimeout(()=>{SG.hidden=true;},150));
  SG.addEventListener('mousedown',e=>e.preventDefault());
  SG.addEventListener('click',e=>{
    const gb=e.target.closest('[data-g]');
    if(gb&&ms){
      const ins='@'+gb.dataset.g+' ';
      ta.value=ta.value.slice(0,ms.start)+ins+ta.value.slice(ms.end);
      const c=ms.start+ins.length;ta.setSelectionRange(c,c);ta.focus();ms=null;SG.hidden=true;return;
    }
    const b=e.target.closest('[data-id]');if(!b||!ms)return;
    const h=hits.find(x=>x.id===b.dataset.id);if(!h)return;
    S.P[h.id]={...(S.P[h.id]||{}),...h};
    const ins='@'+h.name+' ';
    ta.value=ta.value.slice(0,ms.start)+ins+ta.value.slice(ms.end);
    const c=ms.start+ins.length;ta.setSelectionRange(c,c);ta.focus();
    if(!picked.some(p=>p.id===h.id))picked.push({id:h.id,name:h.name});
    ms=null;SG.hidden=true;
  });
  $('#atBtn').addEventListener('click',()=>{
    const pos=ta.selectionStart??ta.value.length,before=ta.value.slice(0,pos);
    const ins=(before&&!/\s$/.test(before)?' ':'')+'@';
    ta.value=before+ins+ta.value.slice(pos);const c=pos+ins.length;ta.focus();ta.setSelectionRange(c,c);check();
  });
  $('#f').addEventListener('submit',async e=>{
    e.preventDefault();
    let body=ta.value.trim();if(!body)return;
    const raw=body,fv=$('#rFoldWrap').hidden?'':$('#rFold').value;
    const ids=new Set(),depts=[];let all=false;
    if(body.includes('@全員')){body=body.split('@全員').join('@{all}');all=true;}
    DEPTS.slice().sort((a,b)=>b.length-a.length).forEach(d=>{const tok='@'+d;if(body.includes(tok)){body=body.split(tok).join('@{g:'+d+'}');depts.push(d);deptMembers(d).forEach(i=>ids.add(i));}});
    picked.sort((a,b)=>b.name.length-a.name.length).forEach(p=>{const tok='@'+p.name;if(body.includes(tok)){body=body.split(tok).join('@{'+p.id+'}');ids.add(p.id);}});
    ids.delete(S.me.id);
    closeSheet();
    const ref=db.collection('reports').doc();
    let saved=[],folderId=null,linked=0;
    if(fv){
      try{folderId=fv.startsWith('id:')?fv.slice(3):await ensureFolder(fv.slice(4));}catch(err){fail(err);}
      if(folderId){
        let toSave=files;const urls=findUrls(raw);
        if(!toSave.length&&!urls.length){
          const d=new Date(),stamp=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
          toSave=[new File([`${cat}｜${pname(S.me.id)}｜${d.toLocaleString('ja-JP')}\n\n${raw}\n`],`報告_${stamp}_${pname(S.me.id)}.txt`,{type:'text/plain'})];
        }
        if(toSave.length)saved=await uploadMany(toSave,folderId,{reportId:ref.id});
        const note=raw.replace(URL_RE,'').replace(/\s+/g,' ').trim().slice(0,80);
        for(const u of urls){try{const r=await addLink(folderId,u,{reportId:ref.id,note,name:(linkName(u)+(note?'：'+note.slice(0,30):'')).slice(0,60)});if(r)linked++;}catch(err){console.warn(err);}}
        if(linked&&!saved.length)toast(`リンク${linked}件をフォルダに保存しました`);
      }
    }
    try{
      await ref.set({author:S.me.id,cat,body,mentions:[...ids],depts:DEPTS.filter(d=>depts.includes(d)),all,acks:{},createdAt:Date.now(),
        files:saved.map(f=>({id:f.id,name:f.name,size:f.size})),folderId:(saved.length||linked)?folderId:null});
      setTimeout(()=>toast(all?'投稿しました（全員にメンション）':depts.length?`投稿しました（${depts.join('・')}ほか ${ids.size}人にメンション）`:ids.size?`投稿しました（${ids.size}人にメンション）`:'投稿しました'),saved.length?2600:0);
    }catch(err){fail(err);}
  });
  setTimeout(()=>ta.focus(),60);
}

function armDelete(btn,fn){
  if(!btn)return;
  let t=0;
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('armed')){clearTimeout(t);fn();return;}
    btn.classList.add('armed');btn.textContent='もう一度押すと削除';
    t=setTimeout(()=>{btn.classList.remove('armed');btn.textContent='削除';},3000);
  });
}

function gateLogin(mode,msg){

// ファイルは軽くしてから、Firestore に小分け（約700KBずつ）にして保存する
const CHUNK=700000,MAX_FILE=15*1024*1024,MAX_IMG_EDGE=2000;
const DEFAULT_REPORT_FOLDER='報告・連絡の資料';
// 本文に貼られたリンク（Googleドライブなど）を見つけて、フォルダに登録する
const URL_RE=/https?:\/\/[^\s<>"'「」『』（）()【】]+/g;
const findUrls=t=>[...new Set(((t||'').match(URL_RE)||[]).map(u=>u.replace(/[。、．，.,!?！？)）\]]+$/,'')))].slice(0,10);
const LINK_SITES=[[/docs\.google\.com\/document/,'Googleドキュメント'],[/docs\.google\.com\/spreadsheets/,'Googleスプレッドシート'],[/docs\.google\.com\/presentation/,'Googleスライド'],
  [/docs\.google\.com\/forms|forms\.gle/,'Googleフォーム'],[/drive\.google\.com/,'Googleドライブ'],[/(youtube\.com|youtu\.be)/,'YouTube'],[/dropbox\.com/,'Dropbox'],
  [/teams\.microsoft\.com|teams\.live\.com/,'Teams'],[/sharepoint\.com/,'Teams・SharePoint'],[/(onedrive\.live\.com|1drv\.ms)/,'OneDrive'],[/canva\.com/,'Canva'],[/notion\.(so|site)/,'Notion'],[/figma\.com/,'Figma'],[/box\.com/,'Box']];
function linkName(url){
  let host='',path='';try{const u=new URL(url);host=u.hostname.replace(/^www\./,'');path=decodeURIComponent(u.pathname).replace(/\/+$/,'');}catch(e){return url.slice(0,60);}
  const site=(LINK_SITES.find(([re])=>re.test(url))||[])[1];
  if(site)return site;
  const last=path.split('/').filter(Boolean).pop()||'';

function fileKind(name,type){
  if(type==='link')return 'link';
  const e=((name||'').split('.').pop()||'').toLowerCase();
  if(e==='pdf'||type==='application/pdf')return 'pdf';
  if((type||'').startsWith('image/')||['jpg','jpeg','png','webp','gif','heic','bmp'].includes(e))return 'image';
  if(['doc','docx','odt','rtf','pages'].includes(e))return 'doc';
  if(['xls','xlsx','csv','ods','numbers'].includes(e))return 'sheet';
  if(['ppt','pptx','odp','key'].includes(e))return 'slide';
  if(['txt','md','json','html','xml'].includes(e)||(type||'').startsWith('text/'))return 'text';
  if(['zip','7z','rar','gz'].includes(e))return 'zip';
  if(/^(video|audio)\//.test(type||'')||['mp4','mov','m4a','mp3','wav'].includes(e))return 'media';
  return 'other';
}
async function blobToB64(blob){
  const u=new Uint8Array(await blob.arrayBuffer());let s='';
  for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);
}
function b64ToBytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function gz(blob){

async function gunzip(blob){return await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();}
// 写真・画像：長い辺を2000pxまで縮め、WebP（使えない端末はJPEG）に変換
async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp|bmp)$/.test(file.type||''))return null;
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,MAX_IMG_EDGE/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const toB=(t,q)=>new Promise(r=>c.toBlob(r,t,q));
    x.drawImage(bmp,0,0,w,h);
    let out=await toB('image/webp',0.8);
    if(!out||out.type!=='image/webp'){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);out=await toB('image/jpeg',0.82);}
    return out&&out.size<file.size*0.95?out:null;
  }catch(e){return null;}
}
async function prepareFile(file){
  let name=file.name||'ファイル',type=file.type||'application/octet-stream',blob=file,conv='',enc='';
  const img=await shrinkImage(file);
  if(img){blob=img;type=img.type;conv=img.type==='image/webp'?'WebP':'JPEG';name=name.replace(/\.[^.]+$/,'')+(img.type==='image/webp'?'.webp':'.jpg');}
  const k=fileKind(name,type);
  if(!['image','zip','media'].includes(k)&&!/\.(docx|xlsx|pptx)$/i.test(name)){
    const z=await gz(blob);if(z&&z.size<blob.size*0.9){blob=z;enc='gzip';}
  }
  return {blob,name,type,enc,conv,origSize:file.size,size:blob.size};
}
async function uploadFile(file,folderId,extra){
  const p=await prepareFile(file);
  if(p.size>MAX_FILE){const e=new Error('too-big');e.code='too-big';e.fileName=file.name;e.size=p.size;throw e;}
  const ref=db.collection('files').doc();
  const parts=Math.max(1,Math.ceil(p.blob.size/CHUNK));
  for(let i=0;i<parts;i++){
    const d=await blobToB64(p.blob.slice(i*CHUNK,(i+1)*CHUNK));
    await ref.collection('chunks').doc(String(i).padStart(3,'0')).set({i,d});
  }
  const meta={folderId,name:p.name,origName:file.name||p.name,type:p.type,enc:p.enc,conv:p.conv,size:p.size,origSize:p.origSize,parts,by:S.me.id,createdAt:Date.now(),...(extra||{})};
  await ref.set(meta);
  db.collection('folders').doc(folderId).update({updatedAt:Date.now()}).catch(()=>{});
  return {id:ref.id,...meta};
}
async function uploadMany(files,folderId,extra){

    catch(e){console.warn(e);bad.push({name:files[i].name,why:e.code==='too-big'?`${fmtSize(e.size)}あり大きすぎます（上限15MB）`:e.code==='permission-denied'?'保存する権限がありません':'保存できませんでした'});}

  const old=pushGet();
  if(old&&old.token&&old.token!==token){try{await db.collection('pushTokens').doc(old.token).delete();}catch(e){}}
  await db.collection('pushTokens').doc(token).set({uid:S.me.id,email:(auth.currentUser&&auth.currentUser.email)||'',hour:prefs.hour,eveningHour:prefs.eveningHour,mention:prefs.mention,ua:navigator.userAgent.slice(0,160),updatedAt:Date.now()},{merge:true});
  pushSet({token,...prefs});
}
function readPushForm(){
  const v=id=>{const el=$(id);if(!el)return undefined;const n=Number(el.value);return n<0?null:n;};
  const p=pushPrefs(),mh=v('#pushM'),eh=v('#pushE'),mc=$('#pushMen');
  return {hour:mh===undefined?p.hour:mh,eveningHour:eh===undefined?p.eveningHour:eh,mention:mc?mc.checked:p.mention};
}
const prefsText=p=>[p.mention?'メンションされたとき':'',p.hour!==null?`朝${p.hour}時`:'',p.eveningHour!==null?`夜${p.eveningHour}時`:''].filter(Boolean).join('・')||'（すべてオフ）';
async function enablePush(prefs){
  let perm=Notification.permission;
  if(perm==='default')perm=await Notification.requestPermission();
  if(perm!=='granted'){toast(perm==='denied'?'通知がブロックされています。端末の設定で許可してください':'通知は許可されませんでした');return false;}
  try{await saveToken(prefs);toast(`通知をオンにしました（${prefsText(prefs)}）`);return true;}
  catch(e){console.warn(e);toast(e&&e.code==='permission-denied'?'通知の設定を保存できませんでした。管理者に連絡してください':'通知をオンにできませんでした。もう一度お試しください');return false;}
}
async function disablePush(silent){
  const p=pushGet();
  if(p&&p.token){
    try{await db.collection('pushTokens').doc(p.token).delete();}catch(e){}
    try{const m=await getMessaging();await m.deleteToken();}catch(e){}
  }
  pushSet(null);if(!silent)toast('通知をオフにしました');
}
async function refreshPush(){
  if(pushState()!=='on')return;
  try{await saveToken(pushPrefs());}catch(e){console.warn(e);}
}
function pushSectionHtml(){
  const st=pushState(),p=pushPrefs();
  const msg={
    on:`オンです。${prefsText(p)}にお知らせします。メンションの通知は、投稿から5〜15分ほどで届きます。`,
    off:'オンにすると、メンションされたときと、朝・夜に選んだ時刻（新しい報告やタスクがあるとき）にお知らせします。',
    blocked:'通知がブロックされています。端末（ブラウザ）の設定で、このアプリの通知を許可してから開き直してください。',
    'ios-home':'iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」し、追加したアイコンから開くと通知をオンにできます。',
    unsupported:'このブラウザは通知に対応していません。スマホはホーム画面に追加したアイコンから、パソコンはChromeかEdgeで開いてください。',
    loading:'確認中…'}[st];
  const opt=(hs,cur,pre)=>`<option value="-1" ${cur===null?'selected':''}>${pre}：オフ</option>`+hs.map(h=>`<option value="${h}" ${h===cur?'selected':''}>${pre}：${h}:00ごろ</option>`).join('');
  const form=`<label class="ntf-chk"><input type="checkbox" id="pushMen" ${p.mention?'checked':''}> 自分・自分の部署・@全員 がメンションされたら知らせる</label>
    <div class="ntf-row"><select id="pushM" aria-label="朝のまとめ">${opt(MORNING_HOURS,p.hour,'朝のまとめ')}</select><select id="pushE" aria-label="夜のまとめ">${opt(EVENING_HOURS,p.eveningHour,'夜のまとめ')}</select></div>
    <div class="ntf-row">${st==='on'?'<button type="button" class="btn ghost" data-pushoff>この端末の通知をオフ</button>':'<button type="button" class="btn primary" data-pushon>通知をオンにする</button>'}</div>`;
  return `<h3>通知</h3><div class="ntf"><p class="intro">${msg}</p>${st==='on'||st==='off'?form:''}</div>`;
}
function pushPromptHtml(){
  if(!S.me.id||S.preview||!S.loaded)return '';
  let dis=false;try{dis=localStorage.getItem('eb-push-dismiss')==='1';}catch(e){}
  if(dis)return '';
  const st=pushState();
  const body=st==='off'&&Notification.permission==='default'?'メンションされたときと、朝7時・夜20時（新しい報告やタスクがあるとき）にお知らせします。時刻は右上のベルから変えられます。'
    :st==='ios-home'?'Safariの共有ボタンから「ホーム画面に追加」して、追加したアイコンから開くと、通知を受け取れます。':'';
  if(!body)return '';
  return `<section class="ntf ntf-home" aria-label="通知"><b>通知を受け取りませんか？</b><p>${body}</p>
    <div class="actions"><button type="button" class="btn ghost" data-pushdismiss>${st==='off'?'あとで':'閉じる'}</button><span class="sp"></span>${st==='off'?'<button type="button" class="btn primary" data-pushon>オンにする</button>':''}</div></section>`;
}
function refreshPushUi(){if(!$('#back').hidden&&$('#sheet .about'))aboutSheet();else paint();}

/* ---------- boot ---------- */
function watch(q,ok){
  unsubs.push(q.onSnapshot(ok,e=>{
    if(e&&e.code==='permission-denied'&&auth.currentUser)gateDenied(auth.currentUser);
    else toast('データを読み込めませんでした。ページを開き直してください');
  }));
}
// 資料フォルダなど、読めなくてもアプリ全体は止めないデータ用
function subSoft(k,q){unsubs.push(q.onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));S.docsDenied=false;schedule();},
  e=>{console.warn(k,e);if(e&&e.code==='permission-denied'){S.docsDenied=true;schedule();}}));}
function sub(k,q){watch(q,s=>{S[k]=s.docs.map(d=>{const o={id:d.id,...d.data()};if(o.depts)o.depts=normDepts(o.depts);return o;});schedule();});}
function start(u){
  S.me={id:u.uid,name:u.displayName||(u.email||'').split('@')[0],avatarUrl:u.photoURL||'',color:colorFor(u.uid)};
  S.P[u.uid]={name:S.me.name,avatarUrl:S.me.avatarUrl,color:S.me.color};
  let first=true;
  watch(db.collection('members'),s=>{
    const m={};s.docs.forEach(d=>{const x=d.data();if(x.depts)x.depts=normDepts(x.depts);m[d.id]=x;S.P[d.id]={name:x.name||'',avatarUrl:x.avatarUrl||'',color:x.color||colorFor(d.id)};});
    S.members=m;
    const mine=m[u.uid];if(mine&&mine.name)S.me.name=mine.name;
    if(first){
      first=false;hideGate();
      sub('tasks',db.collection('tasks'));
      sub('reports',db.collection('reports').orderBy('createdAt','desc').limit(300));
      sub('events',db.collection('events'));
      subSoft('folders',db.collection('folders'));
      subSoft('files',db.collection('files').orderBy('createdAt','desc').limit(500));
      unsubs.push(db.collection('lounge').orderBy('createdAt','desc').limit(150).onSnapshot(s=>{S.lounge=s.docs.map(d=>({id:d.id,...d.data()}));S.loungeDenied=false;schedule();},
        e=>{console.warn('lounge',e);if(e&&e.code==='permission-denied'){S.loungeDenied=true;schedule();}}));
      unsubs.push(db.collection('feedback').where('uid','==',u.uid).onSnapshot(fs=>{S.myFb=fs.docs.map(d=>({id:d.id,...d.data()}));},()=>{}));
      S.loaded=true;
      checkPush().then(()=>{schedule();refreshPush();});
    }
    if(!s.metadata.fromCache&&!S.membersLoaded){S.membersLoaded=true;setTimeout(maybeOnboard,300);}
    schedule();
  });
}
function boot(){
  const d=new Date();S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);
  let v=(location.hash||'').slice(1);
  if(!VIEWS[v]){try{v=localStorage.getItem('eb-view')||'home';}catch(e){v='home';}}
  S.view=VIEWS[v]?v:'home';
  render();
  if(!window.firebase){showGate(`${gateHero('読み込めませんでした')}<div class="card"><p style="margin:0">通信状況を確認して、ページを開き直してください。</p></div>`);return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();db=firebase.firestore();
  auth.languageCode='ja';
  auth.getRedirectResult().catch(e=>gateLogin('login',authMsg(e)));
  let wasIn=false;
  auth.onAuthStateChanged(u=>{
    if(!u){if(wasIn){location.reload();return;}gateLogin('login');return;}
    wasIn=true;
    if(!u.emailVerified){gateVerify(u);return;}
    showGate(`${gateHero('読み込み中…')}`);
    start(u);
  });
}
setInterval(()=>{if($('#back').hidden)schedule();},60000);
boot();
})();
</script>

name: 毎朝の通知

on:
  schedule:
    # UTC で指定（日本時間の 5:50 / 6:50 / 7:50 / 8:50 に起動 → 6〜9時ごろに届く）
    - cron: '50 20 * * *'
    - cron: '50 21 * * *'
    - cron: '50 22 * * *'
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      email:
        description: 'テスト：このメールアドレスの人にだけ今すぐ送る（空欄なら時刻で判定）'
        required: false
        default: ''
      hour:
        description: '送る対象の時刻（6〜9）。空欄なら今の時刻'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: morning-notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 準備
        run: npm install --no-audit --no-fund --prefix scripts
      - name: 通知を送る
        run: node scripts/morning-notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCHEDULE: ${{ github.event.schedule }}
          TEST_EMAIL: ${{ github.event.inputs.email }}
          FORCE_HOUR: ${{ github.event.inputs.hour }}
          APP_URL: https://ando1518.github.io/entrebrew-daily/
